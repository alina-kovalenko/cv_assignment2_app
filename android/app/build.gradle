plugins { id 'com.android.application' }

android {
    namespace 'com.objectlab.app'
    compileSdk 35
    buildToolsVersion '35.0.1'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.objectlab.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/modelAssets'))
}

def generatedModelAssets = layout.buildDirectory.dir('generated/modelAssets')
tasks.register('syncInferenceModels', Sync) {
    from('../../models') { include '*.onnx' }
    into generatedModelAssets
}
tasks.named('preBuild').configure { dependsOn 'syncInferenceModels' }

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}


